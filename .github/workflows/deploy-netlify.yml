name: Deploy to Netlify

# Optional: token-based deploys from CI.
# If you connect the repo to Netlify instead (Netlify -> Add new site -> Import
# an existing project), Netlify builds on every push on its own and this
# workflow is not needed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NETLIFY_AUTH_TOKEN  a Netlify personal access token
#   NETLIFY_SITE_ID     the site's API ID (Site configuration -> General)

on:
  push:
    branches:
      - main
      - arena/01a0eb92-daily-data
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production (unchecked = draft preview URL)'
        type: boolean
        default: true

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # the function imports @neondatabase/serverless, so it must be installed
      # for the CLI to bundle it
      - run: npm ci

      # Assemble the publish directory explicitly so node_modules and the
      # spreadsheet never get uploaded as site content.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html netlify.toml _site/
          cp -r assets data _site/

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production }}" != "true" ]; then
            npx --yes netlify-cli@17 deploy --dir _site --functions netlify/functions \
              --message "draft ${{ github.sha }}"
          else
            npx --yes netlify-cli@17 deploy --prod --dir _site --functions netlify/functions \
              --message "${{ github.sha }}"
          fi
